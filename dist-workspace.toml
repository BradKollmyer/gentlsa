[workspace]
members = ["cargo:."]

# Config for 'dist'
# `dist generate` rewrites .github/workflows/release.yml. After regenerating,
# re-pin action SHAs and keep contents: write on host / package jobs only.
# allow-dirty keeps `dist plan`/`dist host` from rejecting those hand-edits.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Skip freshness checks on the SHA-pinned release.yml
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Publish the Homebrew formula to this tap
tap = "BradKollmyer/homebrew-tap"
publish-jobs = ["homebrew"]
# Wrap Linux binaries as RPM/deb, and ship a FreeBSD .pkg, after the GitHub Release exists
post-announce-jobs = ["./build-rpms", "./build-pkg"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Ship man pages in the release archives (next to the binary)
include = ["man/gentlsa.1", "man/gentlsa.5"]
