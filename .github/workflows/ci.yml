name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux arm64
          - os: macos-latest
            name: macOS arm64
          - os: macos-15-intel
            name: macOS Intel
          - os: windows-latest
            name: Windows x86_64
          - os: windows-11-arm
            name: Windows arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test binary
        shell: bash
        run: bash scripts/smoke-test.sh

      - name: Check man pages
        if: runner.os != 'Windows'
        run: bash scripts/check-man.sh

      - name: Check shell completions are up to date
        if: runner.os != 'Windows'
        run: bash scripts/gen-completions.sh --check

  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Native cargo test + release binary, then pkg add the shipped .pkg.
      # release 14 matches the abi in scripts/build-pkg.sh (FreeBSD:14:amd64).
      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14"
          arch: x86_64
          copyback: false
          cache-after-prepare: true
          prepare: |
            pkg install -y curl python3 ca_root_nss
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            export CARGO_TERM_COLOR=always
            . "$HOME/.cargo/env"
            rustc --version
            cargo test --release --locked
            cargo build --release --locked
            sh scripts/check-man.sh
            sh scripts/gen-completions.sh --check target/release/gentlsa
            sh scripts/smoke-test.sh target/release/gentlsa
            sh scripts/build-pkg.sh --from-bin target/release/gentlsa
            pkg add target/freebsd/gentlsa.amd64.pkg
            sh scripts/smoke-test.sh /usr/local/bin/gentlsa
            test -f /usr/local/share/man/man1/gentlsa.1
            test -f /usr/local/share/man/man5/gentlsa.5
            test -f /usr/local/share/bash-completion/completions/gentlsa
            test -f /usr/local/share/zsh/site-functions/_gentlsa
            test -f /usr/local/share/fish/vendor_completions.d/gentlsa.fish
