name: Build FreeBSD pkg

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  pkg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PLAN: ${{ inputs.plan }}
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-freebsd

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-zigbuild

      - name: Cross-compile FreeBSD amd64
        run: cargo zigbuild --release --locked --target x86_64-unknown-freebsd

      - name: Build pkg
        run: bash scripts/build-pkg.sh --from-bin target/x86_64-unknown-freebsd/release/gentlsa

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-freebsd-packages
          path: target/freebsd/*.pkg

      - name: Attach package to the GitHub Release
        if: ${{ !github.event.pull_request }}
        run: |
          tag="$(printf '%s' "$PLAN" | jq -r '.announcement_tag // empty')"
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "no announcement tag; skipping release upload"
            exit 0
          fi
          gh release upload "$tag" \
            target/freebsd/*.pkg \
            --clobber --repo "${{ github.repository }}"
