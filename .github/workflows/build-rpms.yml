name: Build RPMs and debs

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  rpm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PLAN: ${{ inputs.plan }}
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Fetch release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: dist-artifacts
          merge-multiple: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install packagers
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-generate-rpm,cargo-deb

      - name: Build RPMs and debs
        run: bash scripts/build-rpms.sh --from-artifacts dist-artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-linux-packages
          path: |
            target/generate-rpm/*.rpm
            target/debian/*.deb

      - name: Attach packages to the GitHub Release
        if: ${{ !github.event.pull_request }}
        run: |
          tag="$(printf '%s' "$PLAN" | jq -r '.announcement_tag // empty')"
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "no announcement tag; skipping release upload"
            exit 0
          fi
          gh release upload "$tag" \
            target/generate-rpm/*.rpm \
            target/debian/*.deb \
            --clobber --repo "${{ github.repository }}"
