[package]
name = "gentlsa"
version = "0.5.0"
edition = "2024"
description = "Simple tool for dealing with DANE/TLSA records"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://github.com/BradKollmyer/gentlsa"
repository = "https://github.com/BradKollmyer/gentlsa"
keywords = ["dane", "tlsa", "dns", "tls", "cloudflare", "nsupdate"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
data-encoding = "2"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hickory-net = { version = "0.26", default-features = false, features = ["tokio", "dnssec-ring"] }
hickory-resolver = { version = "0.26", features = ["tokio", "dnssec-ring"] }
hmac = "0.12"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
pem = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-ini = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
x509-parser = "0.18"

[package.metadata.generate-rpm]
auto-req = "no"
require-sh = false
post_install_script = """
if [ -d /run/systemd/system ]; then
    systemd-tmpfiles --create /usr/lib/tmpfiles.d/gentlsa.conf >/dev/null 2>&1 || :
    systemctl daemon-reload >/dev/null 2>&1 || :
fi
"""
assets = [
    { source = "target/release/gentlsa", dest = "/usr/bin/gentlsa", mode = "755" },
    { source = "contrib/systemd/gentlsa-resume.service", dest = "/usr/lib/systemd/system/gentlsa-resume.service", mode = "644" },
    { source = "contrib/systemd/gentlsa-resume.timer", dest = "/usr/lib/systemd/system/gentlsa-resume.timer", mode = "644" },
    { source = "contrib/systemd/gentlsa-rollover@.service", dest = "/usr/lib/systemd/system/gentlsa-rollover@.service", mode = "644" },
    { source = "contrib/systemd/gentlsa.conf", dest = "/usr/lib/tmpfiles.d/gentlsa.conf", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/gentlsa/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/gentlsa/README.md", mode = "644", doc = true },
    { source = "man/gentlsa.1", dest = "/usr/share/man/man1/gentlsa.1", mode = "644", doc = true },
    { source = "man/gentlsa.5", dest = "/usr/share/man/man5/gentlsa.5", mode = "644", doc = true },
    { source = "contrib/completions/gentlsa.bash", dest = "/usr/share/bash-completion/completions/gentlsa", mode = "644" },
    { source = "contrib/completions/_gentlsa", dest = "/usr/share/zsh/site-functions/_gentlsa", mode = "644" },
    { source = "contrib/completions/gentlsa.fish", dest = "/usr/share/fish/vendor_completions.d/gentlsa.fish", mode = "644" },
]

[package.metadata.deb]
maintainer = "Brad Kollmyer <https://github.com/BradKollmyer>"
copyright = "2018 Emiel Kollof, 2026 Brad Kollmyer"
section = "utils"
priority = "optional"
depends = "libc6"
maintainer-scripts = "contrib/debian"
assets = [
    ["target/release/gentlsa", "usr/bin/", "755"],
    ["contrib/systemd/gentlsa-resume.service", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/gentlsa-resume.timer", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/gentlsa-rollover@.service", "usr/lib/systemd/system/", "644"],
    ["contrib/systemd/gentlsa.conf", "usr/lib/tmpfiles.d/", "644"],
    ["LICENSE", "usr/share/doc/gentlsa/LICENSE", "644"],
    ["README.md", "usr/share/doc/gentlsa/README.md", "644"],
    ["man/gentlsa.1", "usr/share/man/man1/", "644"],
    ["man/gentlsa.5", "usr/share/man/man5/", "644"],
    ["contrib/completions/gentlsa.bash", "usr/share/bash-completion/completions/gentlsa", "644"],
    ["contrib/completions/_gentlsa", "usr/share/zsh/site-functions/_gentlsa", "644"],
    ["contrib/completions/gentlsa.fish", "usr/share/fish/vendor_completions.d/gentlsa.fish", "644"],
]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
