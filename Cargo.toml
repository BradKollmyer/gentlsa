[package]
name = "gentlsa"
version = "0.3.0"
edition = "2024"
description = "Simple tool for dealing with DANE/TLSA records"
license = "BSD-2-Clause"
readme = "README.md"
homepage = "https://github.com/BradKollmyer/gentlsa"
repository = "https://github.com/BradKollmyer/gentlsa"
keywords = ["dane", "tlsa", "dns", "tls", "cloudflare"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
hickory-resolver = { version = "0.26", features = ["tokio"] }
pem = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-ini = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
x509-parser = "0.18"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
